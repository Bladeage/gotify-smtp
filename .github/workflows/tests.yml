name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: vet & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Die Go-Version stammt aus der go.mod, damit sie nicht auseinanderlaeuft,
          # wenn das Modul auf eine neue Gotify-Version gehoben wird.
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v ./...
